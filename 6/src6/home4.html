<!DOCTYPE html>

<!-- Demonstrates CSS selectors -->

<html lang="en">
    <head>
        <style>

            body {
                font-size: medium;
                text-align: center;
            }

            #header {
                font-size: large;
            }

            #footer {
                font-size: small;
            }

        </style>
        <title>home</title>
    </head>
    <body>
        <div id="header">
            John Harvard
        </div>
        <div>
            Welcome to my home page!
        </div>
        <div id="footer">
            Copyright &#169; John Harvard
        </div>
    </body>
</html>
